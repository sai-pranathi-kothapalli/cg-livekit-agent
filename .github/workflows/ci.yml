name: CI
on:
  push:
    branches: [main, reethu]
  pull_request:
    branches: [main, reethu]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import check (agent module)
        run: python -c "from agents.entrypoint import entrypoint; print('OK')"
        continue-on-error: true
